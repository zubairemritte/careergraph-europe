[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "careergraph-europe"
version = "0.2.0"
description = "Evidence-led skills intelligence for a country-configurable European job market"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "Zubair Emritte"}]
dependencies = ["fastapi==0.142.2", "pydantic==2.13.5", "starlette==1.7.0", "uvicorn==0.54.0"]

[tool.poetry]
packages = [{include = "careergraph"}]
include = [
  {path = "careergraph/config/*.json", format = ["sdist", "wheel"]},
  {path = "careergraph/sql/*.sql", format = ["sdist", "wheel"]},
  {path = "careergraph/static/*", format = ["sdist", "wheel"]},
]

[tool.poetry.group.dev.dependencies]
httpx = "==0.28.1"
pytest = "==9.1.1"
ruff = "==0.16.10"
mypy = "==2.4.0"

[project.scripts]
careergraph = "careergraph.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["careergraph", "scripts"]
