[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careergraph-europe"
version = "0.1.0"
description = "Evidence-led skills intelligence for a country-configurable European job market"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Zubair Emritte"}]
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
careergraph = "careergraph.cli:main"

[tool.setuptools.packages.find]
include = ["careergraph*"]

[tool.setuptools.package-data]
careergraph = ["config/*.json", "sql/*.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
