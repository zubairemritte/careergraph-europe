name: CareerGraph compatibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small-checks:
    name: ${{ matrix.profile }} / Python 3.12
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: Linux x64
            runner: ubuntu-24.04
            architecture: x64
          - profile: Windows x64
            runner: windows-2022
            architecture: x64
          - profile: macOS Apple Silicon
            runner: macos-14
            architecture: arm64
          - profile: macOS Intel
            runner: macos-15-intel
            architecture: x64
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-07
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-07
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install Poetry and locked dependencies
        run: |
          python -m pip install poetry==2.5.1
          poetry sync --no-interaction
          poetry check --lock
          poetry run python -m pip check
          poetry run careergraph doctor
      - name: Check documented signatures and static types
        run: |
          poetry run ruff check careergraph tests scripts
          poetry run mypy
      - name: Ten small checks; no live collection or full demo
        run: >-
          poetry run pytest -q tests/test_smoke.py tests/test_environment.py
          tests/test_analysis.py::test_skill_bridge_hand_calculated_and_empty_skill_exclusion
          tests/test_connectors.py::test_transient_429_respects_retry_after
          tests/test_connectors.py::test_long_retry_after_stops_instead_of_retrying_too_soon
