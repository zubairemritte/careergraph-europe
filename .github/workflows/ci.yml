name: Validate CareerGraph

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-07
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-07
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check careergraph tests scripts
      - name: Test data contracts and calculations
        run: python -m pytest -q
      - name: Reproduce the offline path
        run: |
          python -m careergraph --db data/ci.db demo
          python -m careergraph --db data/ci.db benchmark --from-file examples/eurostat-context.json
          python -m careergraph --db data/ci.db inspect --country DE --role data_analyst --skills python,sql
          python -m careergraph evaluate
