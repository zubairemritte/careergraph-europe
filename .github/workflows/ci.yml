name: CareerGraph small checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-07
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-07
        with:
          python-version: '3.12'
      - name: Install Poetry and locked dependencies
        run: |
          python -m pip install poetry==2.5.1
          poetry sync --no-interaction
          poetry check --lock
      - name: Check documented signatures and static types
        run: |
          poetry run ruff check careergraph tests scripts
          poetry run mypy
      - name: Eight fixture checks; no live collection or full demo
        run: >-
          poetry run pytest -q tests/test_smoke.py
          tests/test_analysis.py::test_skill_bridge_hand_calculated_and_empty_skill_exclusion
          tests/test_connectors.py::test_transient_429_respects_retry_after
          tests/test_connectors.py::test_long_retry_after_stops_instead_of_retrying_too_soon
